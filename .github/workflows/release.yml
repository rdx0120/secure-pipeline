name: release-signing

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sign:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.20.6

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Create source archive
        run: |
          git archive --format=tar.gz --output=secure-pipeline-source.tar.gz HEAD

      # SBOMs describe the SIGNED ARCHIVE, not the build directory.
      #
      # `syft dir:.` cataloged the checkout, which is a different thing from the
      # artifact being signed, and it ran twice -- so the second pass saw the
      # first pass's output sitting in the directory. Extracting the archive to
      # a fixed path and cataloging that makes the SBOM's subject the exact
      # bytes that get signed, identified by digest.
      - name: Generate SBOMs from the signed archive
        run: |
          DIGEST="sha256:$(sha256sum secure-pipeline-source.tar.gz | cut -d' ' -f1)"
          rm -rf /tmp/sbom-src && mkdir -p /tmp/sbom-src
          tar xzf secure-pipeline-source.tar.gz -C /tmp/sbom-src
          syft dir:/tmp/sbom-src \
            --source-name secure-pipeline-source.tar.gz \
            --source-version "$DIGEST" \
            -o cyclonedx-json=sbom.cdx.json \
            -o spdx-json=sbom.spdx.json

      - name: Sign source archive
        run: |
          cosign sign-blob secure-pipeline-source.tar.gz \
            --bundle secure-pipeline-source.sigstore.json \
            --yes

      - name: Sign CycloneDX SBOM
        run: |
          cosign sign-blob sbom.cdx.json \
            --bundle sbom.cdx.sigstore.json \
            --yes

      - name: Sign SPDX SBOM
        run: |
          cosign sign-blob sbom.spdx.json \
            --bundle sbom.spdx.sigstore.json \
            --yes

      - name: Verify source archive
        run: |
          cosign verify-blob secure-pipeline-source.tar.gz \
            --bundle secure-pipeline-source.sigstore.json \
            --certificate-identity "https://github.com/rdx0120/secure-pipeline/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Verify CycloneDX SBOM
        run: |
          cosign verify-blob sbom.cdx.json \
            --bundle sbom.cdx.sigstore.json \
            --certificate-identity "https://github.com/rdx0120/secure-pipeline/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Verify SPDX SBOM
        run: |
          cosign verify-blob sbom.spdx.json \
            --bundle sbom.spdx.sigstore.json \
            --certificate-identity "https://github.com/rdx0120/secure-pipeline/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: secure-pipeline-signed-artifacts
          path: |
            secure-pipeline-source.tar.gz
            secure-pipeline-source.sigstore.json
            sbom.cdx.json
            sbom.cdx.sigstore.json
            sbom.spdx.json
            sbom.spdx.sigstore.json