name: release-signing

on:
  # Deliberately NOT `push: tags:`. A tag-triggered run has an OIDC subject of
  # `ref:refs/tags/<tag>`, so Fulcio would issue a certificate whose identity is
  # `release.yml@refs/tags/<tag>` -- and every verify command in this workflow
  # and in infra/SIGNING.md is pinned to `@refs/heads/main`. Switching triggers
  # would silently invalidate the documented verification.
  #
  # Dispatching from main keeps the signing identity stable; the tag is just the
  # name the Release is published under, created from the current commit.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0)"
        required: true
        type: string

# Least privilege at the top level. Scorecard's Token-Permissions check flagged
# the previous top-level `contents: write` -- "detected GitHub workflow tokens
# with excessive permissions", score 0/10 -- because a workflow-level grant
# applies to every job in the file, including ones that never publish anything.
permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` is required to create the Release and upload assets,
      # and is the reason the artifacts become fetchable without an Actions
      # login. Scoped to the one job that needs it.
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.20.6

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Create source archive
        run: |
          git archive --format=tar.gz --output=secure-pipeline-source.tar.gz HEAD

      # SBOMs describe the SIGNED ARCHIVE, not the build directory.
      #
      # `syft dir:.` cataloged the checkout, which is a different thing from the
      # artifact being signed, and it ran twice -- so the second pass saw the
      # first pass's output sitting in the directory. Extracting the archive to
      # a fixed path and cataloging that makes the SBOM's subject the exact
      # bytes that get signed, identified by digest.
      - name: Generate SBOMs from the signed archive
        run: |
          DIGEST="sha256:$(sha256sum secure-pipeline-source.tar.gz | cut -d' ' -f1)"
          rm -rf /tmp/sbom-src && mkdir -p /tmp/sbom-src
          tar xzf secure-pipeline-source.tar.gz -C /tmp/sbom-src
          syft dir:/tmp/sbom-src \
            --source-name secure-pipeline-source.tar.gz \
            --source-version "$DIGEST" \
            -o cyclonedx-json=sbom.cdx.json \
            -o spdx-json=sbom.spdx.json

      - name: Sign source archive
        run: |
          cosign sign-blob secure-pipeline-source.tar.gz \
            --bundle secure-pipeline-source.sigstore.json \
            --yes

      - name: Sign CycloneDX SBOM
        run: |
          cosign sign-blob sbom.cdx.json \
            --bundle sbom.cdx.sigstore.json \
            --yes

      - name: Sign SPDX SBOM
        run: |
          cosign sign-blob sbom.spdx.json \
            --bundle sbom.spdx.sigstore.json \
            --yes

      - name: Verify source archive
        run: |
          cosign verify-blob secure-pipeline-source.tar.gz \
            --bundle secure-pipeline-source.sigstore.json \
            --certificate-identity "https://github.com/rdx0120/secure-pipeline/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Verify CycloneDX SBOM
        run: |
          cosign verify-blob sbom.cdx.json \
            --bundle sbom.cdx.sigstore.json \
            --certificate-identity "https://github.com/rdx0120/secure-pipeline/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Verify SPDX SBOM
        run: |
          cosign verify-blob sbom.spdx.json \
            --bundle sbom.spdx.sigstore.json \
            --certificate-identity "https://github.com/rdx0120/secure-pipeline/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: secure-pipeline-signed-artifacts
          path: |
            secure-pipeline-source.tar.gz
            secure-pipeline-source.sigstore.json
            sbom.cdx.json
            sbom.cdx.sigstore.json
            sbom.spdx.json
            sbom.spdx.sigstore.json

      # Run artifacts expire in 90 days and require a GitHub login to download,
      # so the verification commands in infra/SIGNING.md were not runnable by
      # anyone outside the repository. Release assets do not expire and are
      # anonymously fetchable -- which is what makes the signatures independently
      # checkable rather than a claim.
      #
      # `gh` is preinstalled on GitHub runners; no third-party action is added
      # to the release path.
      - name: Publish signed artifacts to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          FILES="secure-pipeline-source.tar.gz secure-pipeline-source.sigstore.json
                 sbom.cdx.json sbom.cdx.sigstore.json
                 sbom.spdx.json sbom.spdx.sigstore.json"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES \
              --title "$TAG" \
              --notes "Keyless Cosign signatures over the source archive and both SBOMs. Verification commands, including the identity pin and a negative case, are in infra/SIGNING.md."
          fi
