name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # NOT the default. actions/checkout defaults to fetch-depth: 1, which
          # silently reduces secret scanning to the tip commit -- see LESSONS.md
          # #4. This repository's own attestation reports FAIL_UNVERIFIABLE on a
          # shallow checkout, so this job would fail without it.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies, enforced from uv.lock
        run: |
          python -m pip install --upgrade pip
          pip install uv

          # `--locked` FAILS the job if uv.lock is out of date with
          # pyproject.toml. `--frozen` does NOT -- it means "do not update the
          # lockfile" and exits 0 against a drifted pyproject. Both were tested
          # in each direction before this flag was chosen: --frozen returned 0
          # on a pyproject with an added dependency and an untouched lock, while
          # --locked returned 1. A lock check that cannot fail is not a check.
          uv sync --locked --extra dev

          # semgrep is installed separately and is deliberately NOT a declared
          # dependency. The runner shells out to it via shutil.which(), exactly
          # like bandit, gitleaks, syft and trivy -- three of which are Go
          # binaries and not pip-installable at all. Listing semgrep as a Python
          # dependency purely because it happens to ship on PyPI would describe
          # the tool inconsistently with the other four.
          pip install semgrep

      - name: Unit tests
        # --locked again, so the lock is enforced even if the install step is
        # ever reordered or cached around.
        run: uv run --locked pytest tests/ -q

      - name: Semgrep rule tests
        # The rules are tested against their own annotated fixtures. LESSONS.md
        # #5 is the reminder that this passing is necessary, not sufficient.
        run: semgrep --test --config rules/ rules/tests/ --metrics=off

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install conftest
        run: |
          go install github.com/open-policy-agent/conftest@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Terraform policy fixtures
        run: |
          conftest test --policy infra/policy/ infra/tests/plan-compliant.json
          # These two MUST fail; the gate is worthless if they pass.
          ! conftest test --policy infra/policy/ infra/tests/plan-violating.json
          ! conftest test --policy infra/policy/ infra/tests/plan-no-sub.json
