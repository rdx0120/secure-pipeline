rules:
  - id: secret-reaches-sink
    languages: [python]
    severity: ERROR
    message: >-
      A value read from a secret-bearing scanner field reaches a log, print, or
      file-write sink. gitleaks puts the PLAINTEXT credential in
      region.snippet.text; forwarding that value to a log or an artifact file
      republishes the secret into a second location with different access
      controls and a different retention policy. Hash it (sha256) or drop it at
      the adapter boundary instead.
    metadata:
      category: security
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      confidence: MEDIUM
      # This is the rule that guards the redaction design in normalizer/adapters.
      # It exists because the tool that finds leaked credentials is itself a
      # credential-handling program.
      references:
        - https://cwe.mitre.org/data/definitions/532.html
    mode: taint
    pattern-sources:
      # 1. Structural: the SARIF path where gitleaks stores the plaintext.
      - pattern-either:
          - pattern: $R["locations"][...]["physicalLocation"]["region"]["snippet"]["text"]
          - pattern: $X["snippet"]["text"]
          - pattern: $X["snippet"]
          - pattern: $X.get("snippet", ...)
      # 2. Nominal: a local whose NAME says it holds a credential. Split from
      #    the structural source because metavariable-regex can only constrain
      #    a metavariable that every pattern in its block actually binds.
      - patterns:
          - pattern: $SECRET
          - metavariable-regex:
              metavariable: $SECRET
              # Identifier-shaped ONLY. An unanchored .* also matched the
              # literal "found secret %s", making every log format string a
              # taint source and firing on correctly-hashed call sites.
              regex: (?i)^[a-z0-9_]*(secret|token|password|passwd|api_?key|credential|private_?key)[a-z0-9_]*$
    pattern-sanitizers:
      - pattern: hashlib.sha256(...)
      - pattern: sha256_hex(...)
      - pattern: redact(...)
      - pattern: $X.hexdigest()
      - pattern: "'***'"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: print(...)
              - pattern: logging.$LEVEL(...)
              - pattern: $LOGGER.info(...)
              - pattern: $LOGGER.debug(...)
              - pattern: $LOGGER.warning(...)
              - pattern: $LOGGER.error(...)
              - pattern: $F.write(...)
              - pattern: $P.write_text(...)
              - pattern: json.dump(...)
              - pattern: sys.stdout.write(...)
